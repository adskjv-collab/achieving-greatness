<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achieving Greatness · Member Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
:root{
--ink:#2a1630; --plum:#4a1d4f; --plum2:#6b2c6f; --blush:#f8e6ea; --blush2:#fdf3f5;
--rose:#c95c7c; --gold:#b0822f; --gold2:#d9b66a; --gold3:#f3e3bb; --cream:#fffaf6;
--line:#ecd9dd; --muted:#7d6a7f; --ok:#2f7d5b; --warn:#b5651d;
--r:18px; --shadow:0 10px 30px -14px rgba(74,29,79,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:2.2rem} h2{font-size:1.75rem} h3{font-size:1.3rem}
a{color:var(--plum2)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);width:100%;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold2);box-shadow:0 0 0 3px var(--gold3)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-weight:600;font-size:.88rem;margin:.9rem 0 .3rem}
.hint{font-size:.82rem;color:var(--muted);font-weight:400}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:999px;padding:.72rem 1.25rem;font-weight:600;background:var(--plum);color:#fff;transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.gold{background:linear-gradient(135deg,#c9a14e,#a87824);color:#fff}
.btn.ghost{background:#fff;color:var(--plum);border:1.5px solid var(--line)}
.btn.sm{padding:.45rem .9rem;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 0 rgba(74,29,79,.03)}
.grid{display:grid;gap:16px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.28rem .65rem;border-radius:999px;background:var(--blush);color:var(--plum)}
.pill.gold{background:var(--gold3);color:#7a5714}
.pill.ok{background:#e1f2ea;color:var(--ok)}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:28px}.mb{margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* top bar + goal ribbon */
.top{position:sticky;top:0;z-index:30;background:rgba(255,250,246,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:10px 0}
.mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f3d9a0,#b0822f);display:grid;place-items:center;color:#fff;font-family:"Cormorant Garamond";font-weight:700;font-size:1.05rem;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--gold2)}
.brand b{font-family:"Cormorant Garamond";font-size:1.3rem;font-weight:700;letter-spacing:.01em}
.ribbon{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.ribbon::-webkit-scrollbar{display:none}
.gchip{flex:1 0 260px;display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--plum),var(--plum2));color:#fff;border-radius:14px;padding:9px 12px;border:0;text-align:left}
.gchip.long{background:linear-gradient(135deg,#8c6420,#b0822f)}
.gchip small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.gchip span.t{display:block;font-weight:600;font-size:.9rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gchip .n{margin-left:auto;font-family:"Cormorant Garamond";font-size:1.25rem;font-weight:700;white-space:nowrap}

/* nav */
.tabs{display:none;gap:4px}
.tabs button{border:0;background:none;padding:.5rem .85rem;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--plum);color:#fff}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 0}
.bnav button i{font-style:normal;font-size:1.25rem;line-height:1}
.bnav button.on{color:var(--plum)}
.bnav button.on i{transform:scale(1.12)}
main{padding:22px 0 110px}
@media(min-width:860px){.tabs{display:flex}.bnav{display:none}main{padding-bottom:60px}}

/* hero card */
.hero{background:radial-gradient(120% 140% at 100% 0%,#f9dfe6 0%,#fff 55%);border:1px solid var(--line);border-radius:24px;padding:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1.5px solid var(--gold3)}
.score{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--blush) 0);display:grid;place-items:center;flex:none}
.ring>div{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-family:"Cormorant Garamond";font-weight:700;font-size:1.45rem;line-height:1}
.ring>div small{display:block;font-family:"DM Sans";font-size:.6rem;letter-spacing:.1em;color:var(--muted);font-weight:700}

/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--gold2);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;margin-top:1px}
.box.on{background:var(--gold);border-color:var(--gold)}
.check b{display:block}
.check .act{margin-left:auto}

/* goal card */
.goal{border-radius:var(--r);padding:20px;color:#fff;background:linear-gradient(140deg,var(--plum),#7a3480);position:relative;overflow:hidden}
.goal.long{background:linear-gradient(140deg,#7d5a1c,#b8893b)}
.goal h3{font-size:1.45rem;margin:.35rem 0 .6rem}
.goal .bar{height:10px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin:.5rem 0}
.goal .bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.goal .btn{background:#fff;color:var(--plum)}
.goal.long .btn{color:#7d5a1c}
.goal .btn.clear{background:rgba(255,255,255,.16);color:#fff}
.goal .meta{font-size:.85rem;opacity:.9}

/* frog */
.frog{display:flex;gap:12px;align-items:center}
.frog .em{font-size:2rem}
.done-strike{text-decoration:line-through;opacity:.6}

/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--blush);position:relative}
.bars .b.hit{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.bars .b em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:.72rem;font-weight:700;color:var(--plum)}
.bars .lbl{font-size:.66rem;color:var(--muted)}
.tline{border-top:2px dashed var(--rose);position:relative}
.diag{border-radius:14px;padding:14px 16px;margin-top:14px;font-size:.95rem}
.diag.push{background:#fdf0e6;border:1px solid #f1d3b8}
.diag.adjust{background:#f3ebf7;border:1px solid #dccbe6}
.diag.win{background:#e7f4ee;border:1px solid #c7e4d6}
.diag.steady{background:var(--blush2);border:1px solid var(--line)}

/* library */
.book{display:flex;flex-direction:column;gap:8px}
.book .by{font-size:.85rem;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.links a{font-size:.82rem;font-weight:600;text-decoration:none;padding:.4rem .75rem;border-radius:999px;background:var(--blush2);border:1px solid var(--line);color:var(--plum)}
.links a.yt{background:#fde8e8;border-color:#f6caca;color:#a3262a}
.links a.free{background:#e7f4ee;border-color:#c7e4d6;color:var(--ok)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.sub button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .9rem;font-weight:600;color:var(--muted)}
.sub button.on{border-color:var(--plum);background:var(--plum);color:#fff}
.note{background:var(--gold3);border-radius:14px;padding:14px 16px;font-size:.92rem}
blockquote{margin:10px 0 0;padding:12px 16px;border-left:3px solid var(--gold2);background:var(--blush2);border-radius:0 12px 12px 0;font-family:"Cormorant Garamond";font-size:1.15rem;font-style:italic;line-height:1.35}
blockquote cite{display:block;font-family:"DM Sans";font-style:normal;font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-top:6px}

/* meeting */
.agenda .check{align-items:center}
.who{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--plum);font-weight:700;font-size:.85rem}
.ro{white-space:pre-wrap;background:var(--blush2);border-radius:10px;padding:10px 12px;min-height:40px;font-size:.93rem}

/* rules */
.rule{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-family:"Cormorant Garamond";font-weight:700;font-size:1.2rem}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(42,22,48,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:999px;z-index:80;font-weight:600;font-size:.92rem;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.lock{max-width:560px;margin:60px auto;text-align:center}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:90;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .eyebrow{font-size:.62rem;letter-spacing:.1em}
.streak{font-family:"Cormorant Garamond";font-size:2.4rem;font-weight:700;line-height:1;color:var(--gold)}
.stepdots{display:flex;gap:6px;margin:8px 0 14px}
.stepdots i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepdots i.on{background:var(--gold)}
.pledge{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:.95rem}
.pledge input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--plum)}
.small{font-size:.85rem}
.lockline{display:flex;gap:10px;align-items:center;background:var(--blush2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-top:12px}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.loglist li:last-child{border-bottom:0}
</style>
</head>

<script>
/* ============ CONTENT ============ */

links:[{t:"Free audiobook · Libby",u:"https://share.libbyapp.com/title/335979",c:"free"},{t:"Free audiobook · Hoopla",u:"https://www.hoopladigital.com/audiobook/No-Excuses-Brian-Tracy/12162232",c:"free"},{t:"YouTube · Brian Tracy on self-discipline",u:"https://www.youtube.com/watch?v=pyNfB24Eo4A",c:"yt"}]},
{id:"frog", title:"Eat That Frog!", by:"Brian Tracy · 21 ways to stop procrastinating",chapters:21,

const WEALTH = [

]},
{sec:"Christian classics · free forever", blurb:"Public domain, so there is no cost and no excuse.", items:[

]}
];

const AGENDA = [

{k:"wins",t:"Wins",d:"Celebrate first. Big or small, say it out loud."},

{k:"numbers",t:"The scoreboard",d:"Actions vs. target, results logged. Are the actions moving the results?"},

{k:"commit",t:"Next week's commitments",d:"Specific, measurable, with an if-then plan."},
{k:"close",t:"Close in prayer & declaration",d:"Pray over each other's goals by name."}

const RULES = [
{t:"We commit.", d:"Your goals are written down and agreed to. A goal you can't see is a wish, so yours stays at the top of every screen.", v:"eccl5"},
{t:"We take it seriously.", d:"Show up to the weekly meeting, do the reading, log honestly. Every week has four non-negotiables: one chapter of the discipline book, one chapter of a wealth book, your action target, and the meeting."},
{t:"No grumbling. No murmuring.", d:"We don't rehearse what isn't working. We talk about what we're doing.", v:"phil"},

const pad = n => String(n).padStart(2,"0");
const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+pad(w)}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtShort = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
function weekLabel(off){const m=addDays(monday(new Date()),off*7);return "Week of "+fmtShort(m)}
function wkAt(off){return weekKey(addDays(monday(new Date()),off*7+3))}
function isObj(o){return o&&typeof o==="object"&&!Array.isArray(o)}
function merge(a,b){const out=isObj(a)?{...a}:{};for(const k in b){out[k]=isObj(b[k])&&isObj(out[k])?merge(out[k],b[k]):b[k]}return out}
function clone(o){return JSON.parse(JSON.stringify(o||{}))}

const items=[

}

function diagnose(m,g){
const G=goalsOf(m)[g]||{};const target=+G.leadTarget||0;const wk=wkAt(0);const a=actions(m,wk,g);
const prev=[-1,-2,-3].map(o=>({a:actions(m,wkAt(o),g),r:results(m,wkAt(o),g)}));
const recentR=[0,-1,-2,-3].reduce((s,o)=>s+results(m,wkAt(o),g),0);
if(!target)return{tone:"steady",msg:"Set a weekly action target so the scoreboard can coach you."};
if(prev.every(w=>w.a>=target)&&prev.every(w=>w.r===0)&&results(m,wk,g)===0)return{tone:"adjust",msg:"Three straight weeks on target and no results logged yet. Your effort is real, so now look at the strategy. Use Evaluate, bring it to the meeting for counsel, and consider setting aside a day of prayer and fasting for direction."};

return{tone:"steady",msg:"Target hit. Results lag behind actions, so keep stacking weeks like this one."};
}

/* actions */
function logAction(g){openSheet(`<h3>+1 ${esc(goalsOf(me())[g].leadLabel)}</h3><p class="muted small">Add a quick note if you want (who, what, where).</p><input data-k="an" placeholder="Optional note"><div class="row mt"><button class="btn gold" onclick="doAction('${g}')">Log it</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);setTimeout(()=>{const i=$("#layer input");i&&i.focus()},50)}
function doAction(g){const m=me();const wk=wkAt(0);const note=($("#layer input")||{}).value||"";const n=actions(m,wk,g)+1;const since=+((m.since||{})[g]||0)+1;
const log=[{t:Date.now(),g,n:note.slice(0,140)},...(m.log||[])].slice(0,150);
closeSheet();saveMe({weeks:{[wk]:{actions:{[g]:n}}},since:{[g]:since},log});
const t=+goalsOf(m)[g].leadTarget||0;if(t&&n===t){confetti(90);toast("Weekly target hit!")}else{confetti(18)}}
function undoAction(g){const m=me();const wk=wkAt(0);const n=Math.max(0,actions(m,wk,g)-1);const since=Math.max(0,+((m.since||{})[g]||0)-1);saveMe({weeks:{[wk]:{actions:{[g]:n}}},since:{[g]:since}});toast("Removed one.")}
function logResult(g){const x=goalsOf(me())[g];openSheet(`<h3>Log a result</h3><p class="muted small">How many ${esc(x.resultLabel)} came in? This is the scoreboard's proof that the actions are working.</p><input data-k="rn" type="number" min="1" value="1" inputmode="numeric"><div class="row mt"><button class="btn gold" onclick="doResult('${g}')">Log it</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`)}
function doResult(g){const m=me();const wk=wkAt(0);const add=Math.max(1,+($("#layer input").value)||1);closeSheet();saveMe({weeks:{[wk]:{results:{[g]:results(m,wk,g)+add}}}});confetti(70);toast("Praise God! Logged.")}

[...ALL_WEALTH.map(b=>`<option value="${b.id}" ${w.book===b.id?"selected":""}>${esc(b.title)}</option>`),...S.library.map(b=>`<option value="${esc(b.id)}" ${w.book===b.id?"selected":""}>${esc(b.title)} (added)</option>`)].join("");

/* report */
function reportText(m){const wk=wkAt(0);const G=goalsOf(m);const w=wkData(m,wk);const commits=((w.mtg||{}).commits||[]).filter(c=>c.t);
const L=[`ACHIEVING GREATNESS · ${weekLabel(0)}`,`${m.name}'s weekly report`,``];

<label>Shelf</label><select data-k="ls"><option value="wealth">Wealth consciousness</option><option value="disc">Discipline</option></select>
<div class="row mt"><button class="btn gold" onclick="addLib()">Add to library</button></div></div>
<div class="grid g2 mt">${S.library.map(r=>`<div class="card book"><span class="pill ${r.shelf==="disc"?"gold":""}">${r.shelf==="disc"?"Discipline":"Wealth"}</span><h3>${esc(r.title)}</h3>${r.note?`<div class="by">${esc(r.note)}</div>`:""}<div class="small muted">Added by ${esc((S.members[r.by]||{}).name||"a member")}</div>${linkBtns([{t:"Open",u:r.url,c:""}])}${r.by===S.uid?`<button class="btn ghost sm" style="align-self:flex-start" onclick="delLib('${esc(r.id)}')">Remove</button>`:""}</div>`).join("")||`<p class="muted">Nothing added yet.</p>`}</div>`}
return h}
function addLib(){const g=k=>(($("#app [data-k='"+k+"']")||{}).value||"").trim();const title=g("lt"),url=g("lu");
if(!title||!/^https:\/\/\S+$/i.test(url)){toast("Add a title and a link that starts with https://");return}
queue(async()=>{const r=await SB.from("ag_library").insert({title:title.slice(0,120),url:url.slice(0,600),note:g("ln").slice(0,200),shelf:g("ls")||"wealth"});if(r.error)throw r.error;
toast("Added.");document.querySelectorAll("#app [data-k^='l']").forEach(e=>{if(e.tagName!=="SELECT")e.value=""})}).then(()=>loadAll()).then(render)}
function delLib(id){S.library=S.library.filter(x=>x.id!==id);render();queue(async()=>{const r=await SB.from("ag_library").delete().eq("id",+id);if(r.error)throw r.error})}

/* ---------- MEETING ---------- */
function v_meeting(m){const off=S.meetOff;const wk=wkAt(off);const prevWk=wkAt(off-1);const mt=S.meetings[wk]||{};const checks=mt.checks||{};
const mine=(wkData(m,wk).mtg)||{};const prevCommits=((wkData(m,prevWk).mtg)||{}).commits||[];
const partners=Object.entries(S.members).filter(([id,x])=>id!==S.uid&&x&&x.committedAt);
const present=!!wkData(m,wk).meeting;
const commits=(mine.commits&&mine.commits.length?mine.commits:[{t:""},{t:""},{t:""}]);
const field=(k,label,ph)=>`<label>${label}</label><textarea data-k="mt.${wk}.${k}" placeholder="${ph}">${esc(mine[k]||"")}</textarea>`;
return `<p class="eyebrow">The weekly meeting</p><div class="row between"><h1 class="mt">${esc(weekLabel(off))}</h1>
<div class="row"><button class="btn ghost sm" onclick="S.meetOff--;render()">← Prev</button>${off<0?`<button class="btn ghost sm" onclick="S.meetOff++;render()">Next →</button>`:""}</div></div>
<div class="row mt"><button class="btn ${present?"ghost":"gold"}" onclick="togglePresent('${wk}')">${present?"✓ I was present":"Mark me present"}</button><span class="muted small">Counts toward this week's non-negotiables.</span></div>

<div class="card mt2 agenda"><h3>Agenda</h3><p class="muted small">Check each item off as you cover it. You both see the same checklist.</p>
${AGENDA.map((a,i)=>`<div class="check" onclick="toggleAgenda('${wk}','${a.k}')" style="cursor:pointer"><div class="box ${checks[a.k]?"on":""}">${checks[a.k]?"✓":i+1}</div><div><b>${esc(a.t)}</b><span class="small muted">${esc(a.d)}</span></div></div>`).join("")}
</div>

<div class="card mt2"><h3>Last week's commitments</h3><p class="muted small">Done or not done. No stories.</p>
${prevCommits.filter(c=>c.t).length?prevCommits.map((c,i)=>c.t?`<div class="check"><div style="flex:1"><b>${esc(c.t)}</b></div><div class="row"><button class="btn sm ${c.done===true?"":"ghost"}" onclick="markCommit('${prevWk}',${i},true)">Done</button><button class="btn sm ${c.done===false?"":"ghost"}" onclick="markCommit('${prevWk}',${i},false)">Not done</button></div></div>`:"").join(""):`<p class="muted small">No commitments were logged for the week before. Set yours below.</p>`}
</div>

<div class="grid g2 mt2">
<div class="card"><div class="who"><div class="av">${esc(initials(m.name))}</div><h3>${esc(m.name)} (you)</h3></div>
${field("wins","Wins","What went right? Celebrate it.")}
${field("takeaways","Book takeaways","One line from each book.")}
${field("challenges","Challenges","Where are you stuck?")}
${field("help","Help I need","Ask for exactly what you need.")}
${field("adjust","Adjustments","Based on the numbers, what changes?")}
<label>Commitments for next week <span class="hint">(specific + measurable)</span></label>
${commits.map((c,i)=>`<input class="mb" data-k="mt.${wk}.c${i}" placeholder="e.g. Send 15 applications by Friday" value="${esc(c.t||"")}">`).join("")}
<button class="btn ghost sm" onclick="addCommit('${wk}')">+ Another</button>
<label>If-then plan for the week</label><input data-k="mt.${wk}.ifthen" placeholder="If ___ happens, then I will ___" value="${esc(mine.ifthen||"")}">
<div class="row mt"><button class="btn gold" onclick="saveMtg('${wk}',${commits.length})">Save my notes</button></div></div>
${partners.map(([id,p])=>{const pm=(wkData(p,wk).mtg)||{};const ro=(l,v)=>`<label>${l}</label><div class="ro">${esc(v||"—")}</div>`;return `<div class="card"><div class="who"><div class="av">${esc(initials(p.name))}</div><h3>${esc(p.name)}</h3>${wkData(p,wk).meeting?`<span class="pill ok" style="margin-left:auto">Present</span>`:""}</div>
${ro("Wins",pm.wins)}${ro("Book takeaways",pm.takeaways)}${ro("Challenges",pm.challenges)}${ro("Help she needs",pm.help)}${ro("Adjustments",pm.adjust)}
<label>Her commitments</label>${(pm.commits||[]).filter(c=>c.t).map(c=>`<div class="ro mb">${esc(c.t)}</div>`).join("")||`<div class="ro">—</div>`}${pm.ifthen?ro("If-then",pm.ifthen):""}</div>`}).join("")||`<div class="card"><h3>Your sister's notes</h3><p class="muted small">They'll appear here once she joins.</p></div>`}
</div>`}
function togglePresent(wk){const v=!wkData(me(),wk).meeting;saveMe({weeks:{[wk]:{meeting:v}}});if(v){confetti(40)}}
function toggleAgenda(wk,k){const cur=((S.meetings[wk]||{}).checks||{});saveMeeting(wk,{checks:{[k]:!cur[k]}})}
function markCommit(wk,i,done){const mt=clone(wkData(me(),wk).mtg);const commits=(mt.commits||[]).map((c,j)=>j===i?{...c,done}:c);saveMe({weeks:{[wk]:{mtg:{commits}}}});if(done)confetti(30)}
function addCommit(wk){const mt=clone(wkData(me(),wk).mtg);const n=readCommits(wk);if(n.length>=7){toast("Seven is plenty. Focus.");return}n.push({t:""});S.members[S.uid]=merge(me(),{weeks:{[wk]:{mtg:{commits:n}}}});render()}
function readCommits(wk){const out=[];document.querySelectorAll(`#app [data-k^="mt.${wk}.c"]`).forEach(el=>{out.push({t:el.value.trim().slice(0,200)})});return out}
function saveMtg(wk){const g=k=>((document.querySelector(`#app [data-k="mt.${wk}.${k}"]`)||{}).value||"").trim();
const prev=((wkData(me(),wk).mtg||{}).commits)||[];const commits=readCommits(wk).map((c,i)=>({t:c.t,done:prev[i]&&prev[i].t===c.t?prev[i].done:null}));
saveMe({weeks:{[wk]:{mtg:{wins:g("wins").slice(0,1500),takeaways:g("takeaways").slice(0,1500),challenges:g("challenges").slice(0,1500),help:g("help").slice(0,1500),adjust:g("adjust").slice(0,1500),ifthen:g("ifthen").slice(0,300),commits}}}});toast("Notes saved.")}

/* ---------- RULES ---------- */
function v_rules(m){return `<p class="eyebrow">Our covenant</p><h1 class="mt">The rules we agreed to.</h1>
<div class="card mt">${RULES.map((r,i)=>`<div class="rule"><div class="num">${i+1}</div><div><h3>${esc(r.t)}</h3><p class="muted" style="margin:.35rem 0 0">${esc(r.d)}</p>${r.v?verse(r.v):""}</div></div>`).join("")}</div>
<h2 class="mt2">Why this works</h2>
<div class="grid g3 mt">
<div class="card"><b>Write it + report it weekly</b><p class="small muted">In Dr. Gail Matthews' goals study at Dominican University, people who wrote their goals, made action commitments and sent weekly progress reports to a friend did the best of every group.</p></div>
<div class="card"><b>If-then plans</b><p class="small muted">A meta-analysis of 94 studies (Gollwitzer &amp; Sheeran, 2006) found that spelling out when, where and how you'll act had a medium-to-large effect on reaching goals. That's why every goal and every week has an if-then plan.</p></div>
<div class="card"><b>Lead and lag measures</b><p class="small muted">From The 4 Disciplines of Execution: you can't control results directly, only the actions that drive them. So we track both, every week, on one scoreboard.</p></div>
</div>
${verse("eccl4")}${verse("deut")}
<div class="card mt2"><h3>My goals</h3><p class="muted small">Committed ${esc(new Date(m.committedAt).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"}))}.</p><div class="row mt"><button class="btn ghost sm" onclick="go('track')">View or edit on the scoreboard</button><button class="btn ghost sm" onclick="logOut()">Log out</button></div></div>
<p class="small mt2"><a href="${PUBLIC_PAGE}#how" target="_blank" rel="noopener">▶ Watch how it works</a></p>`}
</script>
</body>
</html>
